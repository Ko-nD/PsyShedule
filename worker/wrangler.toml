name = "psyshedule"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Публичный адрес не нужен: бот работает только по расписанию
workers_dev = false

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "psyshedule"
